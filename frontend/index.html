<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        #result {
            margin-top: 30px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            display: none;
        }
        
        .success {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Hospital Management System</h1>
        <p>Welcome! Your project is ready to start.</p>
        <button onclick="testBackend()">Test Backend Connection</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Connecting to backend...';
            
            try {
                const response = await fetch('http://localhost:5000/api/test');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <p class="success">✅ SUCCESS!</p>
                    <p>${data.message}</p>
                    <p>Time: ${new Date(data.timestamp).toLocaleString()}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p style="color: red;">❌ Backend is not running!</p>
                    <p>Make sure you started the server with 'npm start'</p>
                `;
            }
        }
    </script>
</body>
</html>
